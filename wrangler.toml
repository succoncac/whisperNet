name = "whispernet-zero-trace"
main = "cloudflare-worker.js"
compatibility_date = "2025-02-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "*"

# Serve the built SPA from ./dist alongside the Worker API & WebSocket
[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Bind the Durable Object for real-time WebSocket broadcast and 30-minute auto-purging storage
[durable_objects]
bindings = [
  { name = "WHISPERNET_HUB", class_name = "WhisperNetHub" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WhisperNetHub"]

